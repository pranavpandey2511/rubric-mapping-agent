[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rubric-mapping-eval"
version = "0.1.0"
description = "Deterministic evaluation for rubric-mapping sectioning and item-to-cell outputs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rubric-mapping-eval = "rubric_mapping_eval.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
